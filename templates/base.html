<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block page_title %}{% endblock page_title %}</title>

        <!-- Script para evitar cintilação (FOUC) ao carregar o tema -->
        <script>
            (() => {
                'use strict';
                const getStoredTheme = () => localStorage.getItem('theme');
                const getPreferredTheme = () => {
                    const storedTheme = getStoredTheme();
                    if (storedTheme) {
                        return storedTheme;
                    }
                    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                };

                const setTheme = theme => {
                    if (theme === 'auto') {
                        document.documentElement.setAttribute(
                            'data-bs-theme',
                            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                        );
                    } else {
                        document.documentElement.setAttribute('data-bs-theme', theme);
                    }
                };

                setTheme(getPreferredTheme());
            })();
        </script>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary mb-2 border-bottom">
            <div class="container-fluid">
                <a class="navbar-brand fw-semibold" href="{% url 'home' %}">To Do Notes</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Alternar navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'todo_list' %}">Tarefas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'note_list' %}">Notas</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                        <!-- Seletor de Tema -->
                        <li class="nav-item dropdown me-2">
                            <button class="btn btn-link nav-link dropdown-toggle d-flex align-items-center py-2 px-0 px-lg-2"
                                    id="bd-theme"
                                    type="button"
                                    aria-expanded="false"
                                    data-bs-toggle="dropdown"
                                    aria-label="Alternar tema">
                                <i class="bi bi-circle-half my-1 theme-icon-active"></i>
                                <span class="d-lg-none ms-2" id="bd-theme-text">Alternar tema</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-theme">
                                <li>
                                    <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light">
                                        <i class="bi bi-sun-fill me-2 opacity-75" data-icon-class="bi-sun-fill"></i>
                                        Claro
                                    </button>
                                </li>
                                <li>
                                    <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark">
                                        <i class="bi bi-moon-stars-fill me-2 opacity-75" data-icon-class="bi-moon-stars-fill"></i>
                                        Escuro
                                    </button>
                                </li>
                                <li>
                                    <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="auto">
                                        <i class="bi bi-circle-half me-2 opacity-75" data-icon-class="bi-circle-half"></i>
                                        Automático
                                    </button>
                                </li>
                            </ul>
                        </li>

                        {% if user.is_authenticated %}
                            <li class="nav-item me-3">
                                <span class="navbar-text">
                                    Olá, <strong>{{ user.username }}</strong>
                                </span>
                            </li>
                            <li class="nav-item">
                                <form action="{% url 'logout' %}" method="post" class="d-flex">
                                    {% csrf_token %}
                                    <button type="submit" class="btn btn-outline-secondary btn-sm">
                                        Sair <i class="bi bi-box-arrow-left"></i>
                                    </button>
                                </form>
                            </li>
                        {% else %}
                            <li class="nav-item">
                                <button onclick="location.href='{% url 'login' %}'" class="btn btn-outline-primary btn-sm">
                                    Entrar <i class="bi bi-box-arrow-in-right"></i>
                                </button>
                            </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container mt-4">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

        </main>

        <main class="container">
            {% block content %}{% endblock content %}
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <!-- Controlador do Alternador de Tema -->
        <script>
            (() => {
                'use strict';
                const getStoredTheme = () => localStorage.getItem('theme');
                const setStoredTheme = theme => localStorage.setItem('theme', theme);

                const getPreferredTheme = () => {
                    const storedTheme = getStoredTheme();
                    if (storedTheme) {
                        return storedTheme;
                    }
                    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                };

                const setTheme = theme => {
                    if (theme === 'auto') {
                        document.documentElement.setAttribute(
                            'data-bs-theme',
                            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                        );
                    } else {
                        document.documentElement.setAttribute('data-bs-theme', theme);
                    }
                };

                const showActiveTheme = (theme) => {
                    const activeThemeIcon = document.querySelector('.theme-icon-active');
                    const btnToActive = document.querySelector(`[data-bs-theme-value="${theme}"]`);

                    if (!btnToActive || !activeThemeIcon) return;

                    const iconClass = btnToActive.querySelector('i').getAttribute('data-icon-class');
                    activeThemeIcon.className = `bi ${iconClass} my-1 theme-icon-active`;

                    document.querySelectorAll('[data-bs-theme-value]').forEach(element => {
                        element.classList.remove('active');
                        element.setAttribute('aria-pressed', 'false');
                    });

                    btnToActive.classList.add('active');
                    btnToActive.setAttribute('aria-pressed', 'true');
                };

                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                    const storedTheme = getStoredTheme();
                    if (storedTheme !== 'light' && storedTheme !== 'dark') {
                        setTheme('auto');
                        showActiveTheme('auto');
                    }
                });

                const initTheme = () => {
                    const currentTheme = getStoredTheme() || 'auto';
                    setTheme(currentTheme);
                    showActiveTheme(currentTheme);

                    document.querySelectorAll('[data-bs-theme-value]').forEach(toggle => {
                        toggle.addEventListener('click', () => {
                            const theme = toggle.getAttribute('data-bs-theme-value');
                            setStoredTheme(theme);
                            setTheme(theme);
                            showActiveTheme(theme);
                        });
                    });
                };

                if (document.readyState === 'loading') {
                    window.addEventListener('DOMContentLoaded', initTheme);
                } else {
                    initTheme();
                }
            })();
        </script>
    </body>
</html>
